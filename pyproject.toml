[project]
name = "quant-terminal"
version = "0.1.0"
description = "量化终端后端、数据库与 Python 运维入口"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10,<4",
    "pandas>=2.2,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pyarrow>=17,<24",
    "python-dotenv>=1,<2",
    "websockets>=14,<17",
]

[project.optional-dependencies]
# 新环境可选择安装交易引擎；本机复用 bot/.venv，不改动模型训练环境。
trading = ["freqtrade>=2026.9,<2027"]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["manage.py", "runtime_config.py", "data_store.py", "data_sync.py", "market_stream.py", "tests/test_*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
