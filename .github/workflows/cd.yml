name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to package"
        required: false
        default: main
        type: string

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || inputs.ref || github.run_id }}
  cancel-in-progress: false

env:
  CI: "true"
  TZ: Asia/Shanghai

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: 构建发布归档
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      package_name: ${{ steps.package.outputs.package_name }}
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      - name: 解析源码版本
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            checkout_ref="$WORKFLOW_RUN_SHA"
          else
            checkout_ref="${DISPATCH_REF:-main}"
            [[ "$checkout_ref" == "main" || "$checkout_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "手动发布来源必须是 main 或 vX.Y.Z 标签。" >&2
              exit 1
            }
          fi
          printf 'checkout_ref=%s\n' "$checkout_ref" >> "$GITHUB_OUTPUT"

      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.checkout_ref }}
          fetch-depth: 0

      - name: 记录提交身份
        id: commit
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          # 发布代码必须属于可信主分支历史，不能打包任意实验分支。
          git merge-base --is-ancestor "$commit_sha" origin/main
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: 验证同一提交的 CI 已成功
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          # 只接受精确提交 SHA 对应的 push CI 成功记录。
          successful_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$COMMIT_SHA" --json headSha,conclusion,event | jq --arg sha "$COMMIT_SHA" '[.[] | select(.headSha == $sha and .conclusion == "success" and .event == "push")] | length')"
          [[ "$successful_runs" -gt 0 ]] || {
            echo "未找到提交 $COMMIT_SHA 的成功 push CI，拒绝打包。" >&2
            exit 1
          }

      - name: 读取项目版本
        id: version
        run: |
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "项目版本必须为 X.Y.Z" >&2
            exit 1
          }
          printf 'project_version=%s\n' "$project_version" >> "$GITHUB_OUTPUT"

      - name: 安装 uv 与 Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 校验后端依赖与源码
        run: |
          uv lock --check
          uv sync --locked --group dev
          uv run --frozen --group dev python -m compileall -q \
            auth_service.py serve_web.py runtime_config.py manage.py \
            data_store.py data_sync.py market_stream.py market_live.py candle_archive.py \
            demo_risk.py demo_acceptance.py demo_account_policy.py demo_account_reconciliation.py \
            demo_execution_service.py demo_runner_controller.py demo_store.py binance_demo_adapter.py demo_api.py tests
          uv run --frozen --group dev ruff check \
            auth_service.py manage.py runtime_config.py data_store.py data_sync.py \
            market_stream.py market_live.py candle_archive.py demo_risk.py demo_acceptance.py \
            demo_account_policy.py demo_account_reconciliation.py demo_execution_service.py \
            demo_runner_controller.py demo_store.py binance_demo_adapter.py demo_api.py tools/release_identity.py tests
          uv run --frozen --group dev python tools/check_frozen_strategy_identities.py --ci

      - name: 安装锁定的前端依赖
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: vben/package.json
          run_install: false
          standalone: true

      - name: 安装项目指定的 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: vben/.node-version
          cache: pnpm
          cache-dependency-path: vben/pnpm-lock.yaml

      - name: 构建前端
        run: |
          pnpm --dir vben install --frozen-lockfile
          python3 -c "from pathlib import Path; from shutil import copyfile; root = Path('vben/apps/web-antd'); copyfile(root / '.env.example', root / '.env')"
          pnpm --dir vben/apps/web-antd typecheck
          pnpm --dir vben build:antd

      - name: 打包源码与前端产物
        id: package
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          PROJECT_VERSION: ${{ steps.version.outputs.project_version }}
        run: |
          set -euo pipefail
          short_sha="${COMMIT_SHA:0:12}"
          release_tag="$(python3 tools/release_identity.py)"
          if [[ -n "$release_tag" ]]; then
            [[ "$release_tag" == "v$PROJECT_VERSION" ]] || {
              echo "发布标签 $release_tag 与 pyproject.toml 版本 $PROJECT_VERSION 不一致。" >&2
              exit 1
            }
            package_name="quant-terminal-${release_tag}"
          else
            package_name="quant-terminal-main-${short_sha}"
          fi
          package_name="${package_name//[^A-Za-z0-9._-]/-}"
          mkdir -p "release/$package_name"
          git archive --format=tar --prefix="$package_name/" HEAD | tar -xf - -C release
          cp -R vben/apps/web-antd/dist "release/$package_name/web-dist"
          printf '{\n  "commit": "%s",\n  "version": "%s",\n  "package": "%s"\n}\n' \
            "$COMMIT_SHA" "$PROJECT_VERSION" "$package_name" > "release/$package_name/build.json"
          tar -czf "release/$package_name.tar.gz" -C release "$package_name"
          sha256sum "release/$package_name.tar.gz" > "release/$package_name.tar.gz.sha256"
          printf 'package_name=%s\n' "$package_name" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: 上传发布归档
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quant-terminal-release
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs: package
    if: needs.package.result == 'success' && needs.package.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: 下载发布归档
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name quant-terminal-release --dir release

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          COMMIT_SHA: ${{ needs.package.outputs.commit_sha }}
          PACKAGE_NAME: ${{ needs.package.outputs.package_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must match vX.Y.Z" >&2
            exit 1
          }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_NAME" == "quant-terminal-$RELEASE_TAG" ]]
          remote_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$remote_commit" == "$COMMIT_SHA" ]] || {
            echo "远端标签在打包后已变化，拒绝发布。" >&2
            exit 1
          }
          # 写权限任务不运行归档代码，只读取清单并验证归档哈希及身份。
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile
          package = os.environ["PACKAGE_NAME"]
          archive = Path("release") / (package + ".tar.gz")
          sidecar = Path(str(archive) + ".sha256")
          expected = sidecar.read_text().split()
          assert len(expected) == 2 and Path(expected[1]).name == archive.name
          assert hashlib.file_digest(archive.open("rb"), "sha256").hexdigest() == expected[0]
          with tarfile.open(archive) as bundle:
              entries = [item for item in bundle.getmembers() if item.name == package + "/build.json"]
              assert len(entries) == 1 and entries[0].isfile() and entries[0].size < 4096
              identity = json.load(bundle.extractfile(entries[0]))
          assert identity == {"commit": os.environ["COMMIT_SHA"],
                              "version": os.environ["RELEASE_TAG"][1:], "package": package}
          PY
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Quant Terminal $RELEASE_TAG" --generate-notes
